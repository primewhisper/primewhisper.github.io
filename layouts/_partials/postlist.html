<ul class="postlist">
{{ range . }}
  <li>
    <a class="title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    <div class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      · {{ .ReadingTime }} min read
      {{ range .Params.tags }}<a class="tag" href="{{ (urlize (printf "tags/%s" .)) | relURL }}/">{{ . }}</a>{{ end }}
    </div>
    {{ with .Description }}<p>{{ . }}</p>{{ else }}<p>{{ .Summary | plainify | truncate 200 }}</p>{{ end }}
  </li>
{{ end }}
</ul>
