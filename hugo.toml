baseURL = "https://primewhisper.com/"
locale = "en-us"
title = "Prime Whisper"
summaryLength = 40

[params]
  author = "Shahar"
  description = "Cryptography, privacy, and security research: where theory meets practice."
  tagline = "Reverse engineering, cryptography, AI, and a close look at the claims around them."

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block  = [["$$", "$$"]]
      inline = [["$", "$"]]
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "About"
    pageRef = "/pages/about"
    weight = 20
